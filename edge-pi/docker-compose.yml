version: '3.8'

services:
  edge-pi:
    build: .
    container_name: mobility_edge_pi
    restart: unless-stopped
    # 하드웨어 제어(서보모터, NPU, 카메라)를 위해 특권 모드 사용
    privileged: true 
    # 호스트 네트워크를 사용하여 BLE 및 MQTT 로컬 통신 원활화
    network_mode: "host" 
    devices:
      - "/dev/video0:/dev/video0"        # Camera Module 3
      - "/dev/hailo0:/dev/hailo0"        # Hailo-8 NPU
      - "/dev/gpiomem:/dev/gpiomem"      # GPIO (서보모터 PWM 제어)
      - "/dev/ttyAMA0:/dev/ttyAMA0"      # Serial (아두이노 BLE 모듈 시리얼 맵핑 시)
      # I2C나 SPI 통신이 필요한 경우 주석 해제
      # - "/dev/i2c-1:/dev/i2c-1"
    volumes:
      # 로컬 개발 시 코드 변경사항 즉시 반영을 위한 볼륨 매핑
      - "./src:/app/src"                 
      # 하드웨어 캘리브레이션 및 설정 값 주입
      - "./config:/app/config"           
      # 추론 모델 파일 마운트 (누락 시 컨테이너 내에서 hef를 읽을 수 없음)
      - "./models:/app/models"
      # 카메라 프레임 공유 메모리 최적화를 위해 shm 매핑
      - "/dev/shm:/dev/shm"              
      # [추가] libcamera가 프레임 버퍼를 할당하기 위해 사용하는 dma_heap 마운트
      - "/dev/dma_heap:/dev/dma_heap"
      # [추가] Docker 내부에서 cv2.imshow(GUI 화면 출력)를 사용하기 위한 X11 소켓 매핑
      - "/tmp/.X11-unix:/tmp/.X11-unix"
    environment:
      - TZ=Asia/Seoul
      # 호스트의 디스플레이 환경변수를 컨테이너로 전달 (GUI 출력용)
      - DISPLAY=${DISPLAY:-:0}
